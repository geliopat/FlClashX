name: Багрепорт / Bug report
title: "[BUG] "
description: Сообщите о возникшей проблеме / Report the issue you are experiencing

body:
  - type: markdown
    attributes:
      value: |
        ## Прежде чем создать проблему, пожалуйста, убедитесь, что:
        1. Вы указали четкий и краткий заголовок проблемы, чтобы другие могли быстро её найти.
        2. Вы проверили, что похожей проблемы нет среди [существующих](https://github.com/geliopat/FlClashZ/issues?q=is%3Aissue), в противном случае, обсуждайте её там.
        3. Вы подробно описали проблему, следуя требованиям шаблона, иначе проблема будет закрыта без рассмотрения.
        ## Before submitting the issue, please make sure of the following checklist:
        1. Please be sure to fill in a concise and clear title for the issue so that others can quickly search
        2. Please make sure there is no similar issue in the [existing issues](https://github.com/geliopat/FlClashZ/issues?q=is%3Aissue), otherwise please discuss under the existing issue
        3. Please describe the problem in detail according to the template specification, otherwise issue will be closed directly.
  - type: textarea
    id: description
    attributes:
      label: Описание проблемы / Describe the bug
      description: Подробно и ясно опишите возникшую у вас проблему, при возможности приложите скриншоты / Describe the problem you encountered in detail and clearly, and provide screenshots
    validations:
      required: true
  - type: textarea
    attributes:
      label: Версия / Version
      description: Пожалуйста, укажите конкретную версию FlClashZ / Please provide the specific version of FlClashZ.
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Тип установки / Installation type
      options:
        - Installer (EXE)
        - Portable (ZIP)
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Компонент / Component
      options:
        - Mihomo / TUN / DNS
        - Zapret2 / Flowseal
        - Strategies / Lists
        - Profiles / Remnawave
        - Windows Helper / Installer / Updates
        - UI / Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Как воспроизвести / To Reproduce
      description: Опишите шаги для воспроизведения ошибки / Steps to reproduce the behavior
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Операционная система / OS
      options:
        - Windows 10 x64
        - Windows 11 x64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Логи / Logs
      description: Приложите относящиеся к проблеме логи Mihomo или Zapret. Удалите токены, ключи, ссылки подписок и личные данные. / Include relevant Mihomo or Zapret logs. Redact tokens, keys, subscription URLs and personal information.
    validations:
      required: true

name: Zapret Windows validation

on:
  push:
    branches:
      - fix/zapret2-stability
      - 'sync/flclashz-*'
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_ref:
        description: Exact candidate commit to validate
        type: string
        required: true

permissions:
  contents: read

# Validation must not modify the commit it tests.
concurrency:
  group: zapret-windows-validation-${{ inputs.candidate_ref || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  windows:
    name: Test and build Windows Release
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_ref || github.sha }}
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Verify Rust formatting
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run Helper unit tests
        run: cargo test --manifest-path services/helper/Cargo.toml

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

      - name: Run Go core tests (Mihomo and FlClashZ additions)
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go test -tags with_gvisor -timeout 10m ./...

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Helper, Zapret and Windows packaging tests
        run: flutter test test/core/desktop/helper_client_test.dart test/providers/zapret_diagnostics_test.dart test/providers/zapret_infrastructure_test.dart test/providers/auto_delay_test.dart test/common/compute_test.dart test/setup_test.dart test/common/preferences_test.dart test/common/disclaimer_consent_test.dart test/common/app_data_test.dart test/common/path_test.dart test/common/channel_import_test.dart test/tool/ico_test.dart test/common/tray_test.dart test/common/tray_menu_test.dart test/common/protocol_test.dart test/common/link_test.dart test/common/launch_test.dart test/common/core_cli_test.dart plugins/tray/test/windows_menu_source_test.dart plugins/tray/test/tray_codec_test.dart test/models/config_test.dart test/models/provider_headers_test.dart test/models/profile_test.dart test/providers/smart_hosts_test.dart

      - name: Run core IPC and desktop transport contract tests
        run: flutter test test/core/protocol_contract_test.dart test/core/desktop/rpc_client_test.dart test/core/desktop/lifecycle_test.dart test/common/preferences_store_test.dart

      - name: Run linked Windows lifecycle regression tests
        run: flutter test test/providers/windows_linked_lifecycle_test.dart test/providers/zapret_history_test.dart test/l10n/localization_contract_test.dart

      - name: Stage pinned Zapret2 and Flowseal assets
        shell: pwsh
        run: ./scripts/setup_zapret.ps1

      - name: Analyze Flutter sources
        run: flutter analyze --no-fatal-infos

      # Debug builds link against the MSVC debug CRT (MSVCP140D/VCRUNTIME140D/UCRTBaseD).
      # Those DLLs are not redistributable. Build Release for a portable user bundle.
      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $iscc)) { throw 'Inno Setup 6 is unavailable' }
          }

      - name: Build Windows Release portable ZIP and installer
        run: dart setup.dart windows --env stable --arch amd64 --targets zip,exe -v

      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          foreach ($file in @('dist/FlClashZ-windows-amd64.zip', 'dist/FlClashZ-windows-amd64-setup.exe')) {
            if (!(Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Missing Windows package: $file"
            }
          }

      - name: Smoke test portable archive
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'flclashz-portable-smoke'
          Expand-Archive -LiteralPath 'dist/FlClashZ-windows-amd64.zip' -DestinationPath $folder -Force
          ./scripts/windows_smoke_test.ps1 -Bundle $folder

      - name: Verify install, startup, uninstall and FlClashX isolation
        shell: pwsh
        run: ./scripts/windows_installer_test.ps1

      - name: Upload Windows Release bundle
        uses: actions/upload-artifact@v6
        with:
          name: FlClashZ-Windows-x64-validation
          path: |
            build/windows/x64/runner/Release/**
            build/windows/runner/Release/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: FlClashZ-Windows-x64-portable
          path: dist/FlClashZ-windows-amd64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload full installer
        uses: actions/upload-artifact@v6
        with:
          name: FlClashZ-Windows-x64-installer
          path: dist/FlClashZ-windows-amd64-setup.exe
          if-no-files-found: error
          retention-days: 7

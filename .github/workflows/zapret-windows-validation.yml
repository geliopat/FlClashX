name: Zapret Windows validation

on:
  push:
    branches: [work/v1.1.5-ui-config]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate commit (empty = selected branch)
        type: string
        required: false
      build_mode:
        description: Fast / Full / Clean
        type: choice
        default: fast
        options: [fast, full, clean]
  workflow_call:
    inputs:
      candidate_ref:
        description: Exact candidate commit to validate
        type: string
        required: true
      update_public_key:
        description: Ed25519 public key pinned in the release binary
        type: string
        required: false
        default: ''
      build_mode:
        type: string
        default: fast

permissions:
  contents: read

# Validation must not modify the commit it tests.
concurrency:
  group: zapret-windows-validation-${{ inputs.candidate_ref || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  # Do not read or populate shared caches while executing a different candidate.
  BUILD_MODE: ${{ (inputs.candidate_ref != '' && inputs.candidate_ref != github.sha && 'clean') || inputs.build_mode || 'fast' }}
  CARGO_INCREMENTAL: '0'

jobs:
  windows:
    name: Test and build Windows Release
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      FLCLASHZ_UPDATE_PUBLIC_KEY: ${{ inputs.update_public_key || vars.FLCLASHZ_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_ref || github.sha }}
          persist-credentials: false

      - name: Validate build mode
        shell: pwsh
        run: |
          if ($env:BUILD_MODE -cnotin @('fast', 'full', 'clean')) { throw 'Invalid build mode' }
          "Build mode: $env:BUILD_MODE" >> $env:GITHUB_STEP_SUMMARY

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BUILD_MODE != 'clean' }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BUILD_MODE != 'clean' }}
          pub-cache: ${{ env.BUILD_MODE != 'clean' }}

      - name: Cache Cargo dependencies
        if: env.BUILD_MODE != 'clean'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            services/helper -> target
            plugins/rust_api/rust -> target
          cache-targets: false
          cache-bin: false
          save-if: ${{ inputs.candidate_ref == '' || inputs.candidate_ref == github.sha }}

      - name: Setup sccache
        if: env.BUILD_MODE == 'fast'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Compute native cache identities
        id: native
        shell: pwsh
        env:
          CORE_INPUTS: ${{ hashFiles('core/**', 'build_config.yaml', 'plugins/setup/**') }}
          HELPER_INPUTS: ${{ hashFiles('services/helper/**', 'build_config.yaml', 'plugins/setup/**') }}
          RUST_INPUTS: ${{ hashFiles('services/helper/Cargo.lock', 'plugins/rust_api/rust/Cargo.lock', 'services/helper/**', 'plugins/rust_api/rust/**') }}
        run: |
          $rust = (rustc -Vv | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'rustc version failed' }
          $go = (go version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'go version failed' }
          function Hash-Text([string]$value) {
            [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($value))).ToLowerInvariant()
          }
          $image = "$env:ImageOS-$env:ImageVersion-$env:RUNNER_ARCH"
          $core = Hash-Text "$image|$go|$env:CORE_INPUTS"
          $helper = Hash-Text "$core|$rust|$env:HELPER_INPUTS"
          $compiler = Hash-Text "$image|$rust|sccache-0.16.0"
          "core=$core" >> $env:GITHUB_OUTPUT
          "helper=$helper" >> $env:GITHUB_OUTPUT
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
          "rust_inputs=$env:RUST_INPUTS" >> $env:GITHUB_OUTPUT

      - name: Restore Go core binary and fingerprint
        id: core_cache
        if: env.BUILD_MODE == 'fast'
        uses: actions/cache/restore@v5
        with:
          path: |
            libclash/windows/FlClashCore.exe
            .dart_tool/setup_build_cache/v2/windows-amd64-core.json
          key: flclashz-core-v2-${{ steps.native.outputs.core }}

      - name: Restore Helper binary and fingerprint
        id: helper_cache
        if: env.BUILD_MODE == 'fast'
        uses: actions/cache/restore@v5
        with:
          path: |
            libclash/windows/FlClashZHelperService.exe
            .dart_tool/setup_build_cache/v2/windows-amd64-helper-release.json
          key: flclashz-helper-v2-${{ steps.native.outputs.helper }}

      - name: Restore bounded compiler cache
        id: compiler_cache
        if: env.BUILD_MODE == 'fast'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/flclashz-sccache
          key: flclashz-sccache-${{ steps.native.outputs.compiler }}-${{ steps.native.outputs.rust_inputs }}
          restore-keys: |
            flclashz-sccache-${{ steps.native.outputs.compiler }}-

      - name: Configure local sccache
        if: env.BUILD_MODE == 'fast'
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=$((Get-Command sccache -ErrorAction Stop).Source)" >> $env:GITHUB_ENV
          'SCCACHE_GHA_ENABLED=false' >> $env:GITHUB_ENV
          'SCCACHE_CACHE_SIZE=1G' >> $env:GITHUB_ENV
          'SCCACHE_IDLE_TIMEOUT=0' >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/flclashz-sccache" | Out-Null
          "SCCACHE_DIR=$env:RUNNER_TEMP/flclashz-sccache" >> $env:GITHUB_ENV

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Verify Rust formatting
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run Helper unit tests
        timeout-minutes: 15
        run: cargo test --manifest-path services/helper/Cargo.toml

      - name: Run Windows service tests
        timeout-minutes: 15
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

      - name: Run Go core tests (Mihomo and FlClashZ additions)
        timeout-minutes: 15
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 -tags with_gvisor -timeout 10m ./...

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Test native build cache
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart test test/build_cache_test.dart

      - name: Run Helper, Zapret and Windows packaging tests
        timeout-minutes: 15
        run: flutter test test/core/desktop/helper_client_test.dart test/providers/zapret_diagnostics_test.dart test/providers/zapret_infrastructure_test.dart test/providers/auto_delay_test.dart test/common/compute_test.dart test/setup_test.dart test/common/preferences_test.dart test/common/disclaimer_consent_test.dart test/common/app_data_test.dart test/common/path_test.dart test/common/channel_import_test.dart test/tool/ico_test.dart test/common/tray_test.dart test/common/tray_menu_test.dart test/common/protocol_test.dart test/common/link_test.dart test/common/launch_test.dart test/common/core_cli_test.dart plugins/tray/test/windows_menu_source_test.dart plugins/tray/test/tray_codec_test.dart test/models/config_test.dart test/models/provider_headers_test.dart test/models/managed_settings_test.dart test/providers/zapret_managed_settings_test.dart test/models/profile_test.dart test/providers/smart_hosts_test.dart

      - name: Run core IPC and desktop transport contract tests
        timeout-minutes: 15
        run: flutter test test/core/connection_snapshot_test.dart test/core/protocol_contract_test.dart test/core/desktop/rpc_client_test.dart test/core/desktop/lifecycle_test.dart test/common/preferences_store_test.dart

      - name: Run linked Windows lifecycle regression tests
        timeout-minutes: 15
        run: flutter test --timeout 2m test/providers/windows_linked_lifecycle_test.dart test/providers/zapret_history_test.dart test/providers/zapret_list_updater_test.dart test/providers/resources_action_test.dart test/providers/geo_resource_action_test.dart test/common/traffic_history_test.dart test/providers/setup_action_test.dart test/l10n/localization_contract_test.dart

      - name: Run FlClashZ UI regression tests
        timeout-minutes: 15
        run: flutter test test/icons/glyph_painter_test.dart test/providers/window_material_test.dart test/views/about_test.dart test/views/dashboard/provider_mode_test.dart test/views/dashboard/widget_registry_test.dart test/views/dashboard/wide_test.dart test/widgets/core_status_button_test.dart test/views/connection_feeds_test.dart test/widgets/sidebar_test.dart test/features/tracker_info_visuals_test.dart test/ui/network_palette_test.dart test/ui/hover_glow_test.dart test/ui/material_appearance_test.dart test/providers/appearance_test.dart

      - name: Run window restoration navigation regression
        timeout-minutes: 5
        run: flutter test test/pages/home_test.dart --plain-name "desktop destinations remain clickable after window restoration"

      - name: Run global latency deduplication regression tests
        timeout-minutes: 5
        run: flutter test test/providers/proxies_action_test.dart --plain-name "delayTest"

      - name: Run speed test target and card layout regressions
        timeout-minutes: 5
        run: flutter test test/providers/speed_test_test.dart test/widgets/proxy_card_oneline_test.dart

      - name: Run provider ownership and context menu regression tests
        timeout-minutes: 15
        run: flutter test test/widgets/managed_setting_test.dart test/providers/profile_headers_action_test.dart test/views/profiles/edit_profile_device_headers_test.dart

      - name: Run signed manifest and updater tests
        timeout-minutes: 15
        shell: pwsh
        run: |
          flutter test "--dart-define=FLCLASHZ_UPDATE_PUBLIC_KEY=$env:FLCLASHZ_UPDATE_PUBLIC_KEY" test/features/update/manifest_test.dart test/features/update/asset_test.dart test/features/update/controller_test.dart test/features/update/download_test.dart test/features/update/identity_test.dart test/features/update/platform_test.dart test/tool/sign_update_manifest_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore pinned Zapret downloads
        id: zapret_cache
        if: env.BUILD_MODE != 'clean'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/flclashz-zapret-downloads
          key: flclashz-zapret-v1-${{ hashFiles('scripts/setup_zapret.ps1') }}

      - name: Stage pinned Zapret2 and Flowseal assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FLCLASHZ_ZAPRET_CACHE_DIR: ${{ env.BUILD_MODE != 'clean' && format('{0}/flclashz-zapret-downloads', runner.temp) || '' }}
        run: ./scripts/setup_zapret.ps1

      - name: Analyze Flutter sources
        run: flutter analyze --no-fatal-infos

      # Debug builds link against the MSVC debug CRT (MSVCP140D/VCRUNTIME140D/UCRTBaseD).
      # Those DLLs are not redistributable. Build Release for a portable user bundle.
      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $iscc)) { throw 'Inno Setup 6 is unavailable' }
          }

      - name: Build Windows Release portable ZIP and installer
        run: dart setup.dart windows --env stable --arch amd64 --targets zip,exe -v

      - name: Collect compiler cache statistics
        if: env.BUILD_MODE == 'fast'
        shell: pwsh
        run: |
          # Installer validation can stop processes; collect stats before it.
          sccache --show-stats | Tee-Object -FilePath "$env:RUNNER_TEMP/sccache-stats.txt"
          if ($LASTEXITCODE -ne 0) { Write-Warning "sccache statistics unavailable" }
          # The server may already have stopped. This is not a build failure.
          sccache --stop-server
          if ($LASTEXITCODE -ne 0) { Write-Warning "sccache server already stopped or unavailable" }
          exit 0

      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          foreach ($file in @('dist/FlClashZ-windows-amd64.zip', 'dist/FlClashZ-windows-amd64-setup.exe')) {
            if (!(Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Missing Windows package: $file"
            }
          }

      - name: Smoke test portable archive
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'flclashz-portable-smoke'
          Expand-Archive -LiteralPath 'dist/FlClashZ-windows-amd64.zip' -DestinationPath $folder -Force
          ./scripts/windows_smoke_test.ps1 -Bundle $folder

      - name: Verify install, startup, uninstall and FlClashX isolation
        shell: pwsh
        run: ./scripts/windows_installer_test.ps1


      - name: Save verified Go core
        if: env.BUILD_MODE == 'fast' && (inputs.candidate_ref == '' || inputs.candidate_ref == github.sha) && steps.core_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            libclash/windows/FlClashCore.exe
            .dart_tool/setup_build_cache/v2/windows-amd64-core.json
          key: ${{ steps.core_cache.outputs.cache-primary-key }}

      - name: Save verified Helper
        if: env.BUILD_MODE == 'fast' && (inputs.candidate_ref == '' || inputs.candidate_ref == github.sha) && steps.helper_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            libclash/windows/FlClashZHelperService.exe
            .dart_tool/setup_build_cache/v2/windows-amd64-helper-release.json
          key: ${{ steps.helper_cache.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: env.BUILD_MODE == 'fast' && (inputs.candidate_ref == '' || inputs.candidate_ref == github.sha) && steps.compiler_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/flclashz-sccache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

      - name: Save pinned Zapret downloads
        if: env.BUILD_MODE != 'clean' && (inputs.candidate_ref == '' || inputs.candidate_ref == github.sha) && steps.zapret_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/flclashz-zapret-downloads
          key: ${{ steps.zapret_cache.outputs.cache-primary-key }}

      - name: Report cache restore results
        if: always()
        shell: pwsh
        env:
          CORE_HIT: ${{ steps.core_cache.outputs.cache-hit }}
          HELPER_HIT: ${{ steps.helper_cache.outputs.cache-hit }}
          COMPILER_HIT: ${{ steps.compiler_cache.outputs.cache-hit }}
          ZAPRET_HIT: ${{ steps.zapret_cache.outputs.cache-hit }}
        run: |
          @(
            '### Cache restore (native fingerprints are validated separately)'
            "| Mode | Core | Helper | Compiler | Zapret |"
            '|---|---|---|---|---|'
            "| $env:BUILD_MODE | $env:CORE_HIT | $env:HELPER_HIT | $env:COMPILER_HIT | $env:ZAPRET_HIT |"
          ) >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path ".dart_tool/setup_build_cache/hook.log") {
            '### Native build decisions' >> $env:GITHUB_STEP_SUMMARY
            Get-Content ".dart_tool/setup_build_cache/hook.log" | Select-String -Pattern 'Cache hit:|Rebuilding |Building Go core:|Building Rust helper:' | ForEach-Object { "    $_" } >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path "$env:RUNNER_TEMP/sccache-stats.txt") {
            Get-Content "$env:RUNNER_TEMP/sccache-stats.txt" | ForEach-Object { "    $_" } >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows Release bundle
        uses: actions/upload-artifact@v6
        with:
          name: FlClashZ-Windows-x64-validation
          path: |
            build/windows/x64/runner/Release/**
            build/windows/runner/Release/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: FlClashZ-Windows-x64-portable
          path: dist/FlClashZ-windows-amd64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload full installer
        uses: actions/upload-artifact@v6
        with:
          name: FlClashZ-Windows-x64-installer
          path: dist/FlClashZ-windows-amd64-setup.exe
          if-no-files-found: error
          retention-days: 7

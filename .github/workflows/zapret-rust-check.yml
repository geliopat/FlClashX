name: Zapret Windows checks

concurrency:
  group: zapret-windows-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/zapret-ui-integration
    paths:
      - "plugins/rust_api/rust/**"
      - "plugins/rust_api/lib/**"
      - "windows/**"
      - "lib/**"
      - "test/**"
      - ".github/workflows/zapret-rust-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "plugins/rust_api/rust/**"
      - "plugins/rust_api/lib/**"
      - "windows/**"
      - "lib/**"
      - "test/**"
      - ".github/workflows/zapret-rust-check.yml"

permissions:
  contents: write

jobs:
  rust-windows:
    # Temporary pause requested by user; restore when compilation is authorized.
    if: false
    name: Rust (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check
      - name: Compile and run unit tests
        run: cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  generate-bindings:
    # Temporary pause requested by user; restore when compilation is authorized.
    if: false
    name: Generate Flutter Rust Bridge bindings (Windows)
    needs: rust-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/zapret-ui-integration
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Install project dependencies
        run: flutter pub get
      - name: Format Flowseal Flutter UI and UAC handoff
        run: dart format lib/views/zapret.dart lib/views/tools.dart lib/views/views.dart lib/main.dart lib/bootstrap.dart lib/common/lock.dart test/common/lock_test.dart
      - name: Test Windows single-instance lock handoff
        run: flutter test test/common/lock_test.dart
      - name: Install Flutter Rust Bridge code generator
        run: cargo install --locked --version 2.13.0 flutter_rust_bridge_codegen
      - name: Generate bindings
        working-directory: plugins/rust_api
        run: flutter_rust_bridge_codegen generate
      - name: Format generated bindings and Rust sources
        run: cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check
      - name: Refresh Rust dependency lockfile
        run: cargo generate-lockfile --manifest-path plugins/rust_api/rust/Cargo.toml
      - name: Build Windows app
        run: flutter build windows --debug

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows release packages
        run: dart setup.dart windows --env pre --targets exe,zip --arch amd64 -v

      - name: Upload Windows Zapret test packages
        uses: actions/upload-artifact@v6
        with:
          name: FlClashX-Zapret-Windows-x64-pre
          path: |
            dist/FlClashX-windows-amd64.zip
            dist/FlClashX-windows-amd64-setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated bindings
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/rust_api/rust/src plugins/rust_api/rust/Cargo.lock plugins/rust_api/lib/src/rust plugins/rust_api/lib/rust_api.dart lib/views/zapret.dart lib/views/tools.dart lib/views/views.dart lib/main.dart lib/bootstrap.dart lib/common/lock.dart test/common/lock_test.dart
          if (-not (git diff --cached --quiet)) {
            git commit -m "Generate and format Flowseal Flutter Rust Bridge bindings"
            git push origin HEAD:feature/zapret-ui-integration
          } else {
            Write-Host "Generated bindings are already up to date."
          }

  <g fill="none" stroke-width="22.2" stroke-linecap="round">
    <path d="M88 84 H166" stroke="url(#top)"/>
    <path d="M90 172 H172" stroke="url(#bottom)"/>
    <path d="M166 85 L90 176" stroke="#101318" stroke-opacity=".45" stroke-width="24"/>

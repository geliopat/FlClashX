<?xml version="1.0" encoding="UTF-8"?>
<!-- FlClashZ: rounded Z, with the silver diagonal layered over cyan bars. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>FlClashZ</title>
  <defs>
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="88" y1="84" x2="166" y2="84">
      <stop offset="0" stop-color="#58F1FE"/>
      <stop offset="1" stop-color="#1F9CB5"/>
    </linearGradient>
    <linearGradient id="bottom" gradientUnits="userSpaceOnUse" x1="90" y1="172" x2="172" y2="172">
      <stop offset="0" stop-color="#047A9A"/>
      <stop offset="1" stop-color="#08A0BC"/>
    </linearGradient>
    <linearGradient id="diagonal" gradientUnits="userSpaceOnUse" x1="166" y1="83" x2="90" y2="174">
      <stop offset="0" stop-color="#DAE6F5"/>
      <stop offset="1" stop-color="#BECBDD"/>
    </linearGradient>
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="256">
